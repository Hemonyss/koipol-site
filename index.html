<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Муржик скинь чулочки</title>
    <link rel="stylesheet" href="main.css">
</head>
    <body>
        <div class="gallery" id="gallery">

        </div>
    </body>
    <script>
        const totalImg = 4;
        const gallery = document.getElementById('gallery');

        gallery.innerHTML = Array.from({length: totalImg}, (_, i) => 
            `<img src="images/${i}.jpg" loading="lazy" alt="Image ${i}">`
        ).join('')
    </script>
</html>
